<style>
    body {
        margin: 0;
        font-family: "Noto Sans TC", sans-serif;
        background: linear-gradient(135deg, #e3f2fd, #ffffff);
    }

    header {
        background-color: #1565c0;
        color: white;
        text-align: center;
        padding: 40px 20px;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
    }

    header p {
        margin-top: 10px;
        font-size: 16px;
        opacity: 0.9;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
    }

    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .card {
        background-color: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        text-align: center;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .card a {
        text-decoration: none;
        color: #1565c0;
        font-weight: bold;
        font-size: 18px;
    }

    .card p {
        margin-top: 10px;
        font-size: 14px;
        color: #555;
    }

    /* QR Code 區域 */
    .qr-section {
        text-align: center;
        margin: 40px auto;
        padding: 25px;
    }

    .qr-section h2 {
        color: #1565c0;
        margin-bottom: 15px;
    }

    .qr-code {
        width: 200px;
        height: 200px;
        object-fit: contain;
        background-color: white;
        padding: 10px;
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .qr-section p {
        color: #666;
        font-size: 14px;
        margin-top: 12px;
    }

    footer {
        text-align: center;
        padding: 20px;
        font-size: 14px;
        color: #777;
    }
</style>
